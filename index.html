<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a33">
  <title>JF Scanner</title>
  <meta name="description" content="Escaneie documentos pelo celular e gere arquivos PDF.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <style>
    :root{--navy:#071a33;--blue:#1167d8;--cyan:#29b6f6;--paper:#f4f7fb;--ink:#10243e;--muted:#63738a;--line:#dbe3ee;--danger:#d63a48;--shadow:0 14px 36px rgba(7,26,51,.12)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e8f1fb 0,#f8fafc 48%,#edf4fc 100%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit}button{cursor:pointer}.shell{width:min(100%,1040px);margin:auto;min-height:100vh;background:rgba(255,255,255,.74);box-shadow:0 0 50px rgba(7,26,51,.07)}
    header{background:var(--navy);color:#fff;padding:max(18px,env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--cyan),var(--blue));display:grid;place-items:center;font-weight:900;font-size:1.15rem;box-shadow:0 6px 20px rgba(41,182,246,.3)}
    h1{font-size:1.25rem;margin:0}.brand small{display:block;color:#b8c9de;margin-top:2px}.count{background:#163454;padding:7px 11px;border-radius:999px;font-size:.82rem;white-space:nowrap}
    main{padding:22px 18px 110px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:16px}.intro h2{margin:0 0 4px;font-size:1.35rem}.intro p{margin:0;color:var(--muted)}
    .empty{border:2px dashed #b9c9dc;border-radius:22px;background:rgba(255,255,255,.75);min-height:360px;display:grid;place-items:center;text-align:center;padding:35px 20px}.empty-icon{width:86px;height:108px;border:3px solid #8aa3bf;border-radius:9px;margin:auto auto 20px;position:relative;background:#fff}.empty-icon:after{content:"+";position:absolute;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:white;font-size:1.8rem;font-weight:300;right:-20px;bottom:15px;border:4px solid white}.empty h3{margin:0 0 7px}.empty p{color:var(--muted);margin:0 auto;max-width:360px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}.preview{aspect-ratio:1/1.414;background:#e9eef5;border-radius:12px;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.meta{display:flex;justify-content:space-between;align-items:center;padding:10px 3px 3px}.meta strong{font-size:.92rem}.tools{display:flex;gap:6px}.icon-btn{border:0;background:#eef3f9;color:var(--ink);border-radius:9px;width:38px;height:38px;font-size:1.05rem}.icon-btn.delete{color:var(--danger)}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1040px);padding:12px 18px max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;gap:10px;z-index:6}.btn{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:9px}.scan{background:linear-gradient(135deg,var(--blue),#0952b4);color:white;flex:1;box-shadow:0 8px 20px rgba(17,103,216,.25)}.pdf{background:var(--navy);color:white;flex:1}.pdf:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#edf3f9;color:var(--ink)}
    dialog{border:0;border-radius:22px;padding:0;width:min(92vw,480px);box-shadow:0 30px 90px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(3,14,29,.7)}.dialog-body{padding:22px}.dialog-body h3{margin:0 0 6px}.dialog-body p{color:var(--muted);margin:0 0 18px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.filter{border:2px solid var(--line);background:#fff;padding:12px 6px;border-radius:12px;font-weight:700}.filter.active{border-color:var(--blue);color:var(--blue);background:#eef6ff}.dialog-actions{display:flex;gap:8px;margin-top:20px}.dialog-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#10243e;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:560px){header{padding-left:16px;padding-right:16px}.brand small{display:none}.count{font-size:.76rem}main{padding:18px 14px 104px}.intro{align-items:start}.intro p{font-size:.9rem}.empty{min-height:55vh}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border-radius:14px;padding:7px}.meta{padding-top:7px}.meta strong{font-size:.78rem}.icon-btn{width:34px;height:34px}.bottom{padding-left:12px;padding-right:12px}.btn{padding:0 12px;font-size:.92rem}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><div class="logo">JF</div><div><h1>JF Scanner</h1><small>Documentos em PDF</small></div></div><div class="count" id="count">Nenhuma página</div></header>
  <main><div class="intro"><div><h2>Seu documento</h2><p>Fotografe uma página de cada vez.</p></div><button class="btn secondary" id="clear" hidden>Limpar</button></div><section id="empty" class="empty"><div><div class="empty-icon"></div><h3>Pronto para escanear</h3><p>Posicione o documento em um local bem iluminado e mantenha o celular firme.</p></div></section><section id="pages" class="grid" hidden></section></main>
  <div class="bottom"><label class="btn scan" for="camera">📷 Escanear página</label><button class="btn pdf" id="makePdf" disabled>▣ Gerar PDF</button></div>
</div>
<input id="camera" type="file" accept="image/*" capture="environment" hidden multiple>
<dialog id="editDialog"><div class="dialog-body"><h3>Aparência da página</h3><p>Escolha como o documento deve ficar.</p><div class="filters"><button class="filter active" data-filter="normal">Original</button><button class="filter" data-filter="contrast">Nítido</button><button class="filter" data-filter="gray">P&B</button></div><div class="dialog-actions"><button class="btn secondary" id="cancelEdit">Cancelar</button><button class="btn scan" id="saveEdit">Aplicar</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
  const input=document.querySelector('#camera'),pagesEl=document.querySelector('#pages'),empty=document.querySelector('#empty'),count=document.querySelector('#count'),makePdf=document.querySelector('#makePdf'),clear=document.querySelector('#clear'),dialog=document.querySelector('#editDialog');
  let pages=[],editing=-1,pendingFilter='normal';
  const toast=m=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
  input.addEventListener('change',async e=>{for(const file of [...e.target.files]){if(!file.type.startsWith('image/'))continue;pages.push({src:await read(file),rotation:0,filter:'normal'});}input.value='';render();if(pages.length)toast('Página adicionada');});
  const read=file=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  function render(){const has=pages.length>0;empty.hidden=has;pagesEl.hidden=!has;clear.hidden=!has;makePdf.disabled=!has;count.textContent=has?`${pages.length} ${pages.length===1?'página':'páginas'}`:'Nenhuma página';pagesEl.innerHTML='';pages.forEach((p,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="preview"><img alt="Página ${i+1}" src="${p.src}" style="transform:rotate(${p.rotation}deg);filter:${cssFilter(p.filter)}"></div><div class="meta"><strong>Página ${i+1}</strong><div class="tools"><button class="icon-btn edit" title="Ajustar">◐</button><button class="icon-btn rotate" title="Girar">↻</button><button class="icon-btn delete" title="Excluir">×</button></div></div>`;c.querySelector('.rotate').onclick=()=>{p.rotation=(p.rotation+90)%360;render()};c.querySelector('.delete').onclick=()=>{pages.splice(i,1);render()};c.querySelector('.edit').onclick=()=>openEdit(i);pagesEl.append(c);});}
  const cssFilter=f=>f==='gray'?'grayscale(1) contrast(1.25)':f==='contrast'?'contrast(1.28) saturate(.85) brightness(1.05)':'none';
  function openEdit(i){editing=i;pendingFilter=pages[i].filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===pendingFilter));dialog.showModal()}
  document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{pendingFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b))});
  document.querySelector('#cancelEdit').onclick=()=>dialog.close();document.querySelector('#saveEdit').onclick=()=>{pages[editing].filter=pendingFilter;dialog.close();render();toast('Ajuste aplicado')};
  clear.onclick=()=>{if(confirm('Remover todas as páginas?')){pages=[];render()}};
  async function processed(p){const img=await new Promise((ok,no)=>{const x=new Image;x.onload=()=>ok(x);x.onerror=no;x.src=p.src});const swap=p.rotation%180!==0,c=document.createElement('canvas'),max=1800,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;c.width=swap?h:w;c.height=swap?w:h;const x=c.getContext('2d');x.save();x.translate(c.width/2,c.height/2);x.rotate(p.rotation*Math.PI/180);x.filter=cssFilter(p.filter);x.drawImage(img,-w/2,-h/2,w,h);x.restore();return c.toDataURL('image/jpeg',.88)}
  makePdf.onclick=async()=>{makePdf.disabled=true;makePdf.textContent='Preparando…';try{if(!window.jspdf)throw Error();const {jsPDF}=window.jspdf;let pdf;for(let i=0;i<pages.length;i++){const data=await processed(pages[i]);const img=await new Promise(ok=>{const x=new Image;x.onload=()=>ok(x);x.src=data});const landscape=img.width>img.height,format=landscape?[297,210]:[210,297];if(!pdf)pdf=new jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'});else pdf.addPage(format,landscape?'landscape':'portrait');const scale=Math.min(format[0]/img.width,format[1]/img.height),w=img.width*scale,h=img.height*scale;pdf.addImage(data,'JPEG',(format[0]-w)/2,(format[1]-h)/2,w,h,undefined,'FAST');}pdf.save(`JF-Scanner-${new Date().toISOString().slice(0,10)}.pdf`);toast('PDF criado com sucesso');}catch(e){toast('Não foi possível gerar o PDF. Verifique sua internet.')}finally{makePdf.disabled=false;makePdf.textContent='▣ Gerar PDF'}};
  render();
</script>
</body></html>
